# Configuracion de publicacion de esta app para tools/macos/publish_release.sh (la pieza
# canonica de LGA_Base_QT_C_Py). Solo variables: la logica vive en la pieza. Parametros en
# ../LGA_Base_QT_C_Py/docs/Doc_Deploy_macOS.md §5.
APP_NAME="LGA Mighty Tools"
ARTIFACT_NAME="LGA_MightyTools"
RELEASE_REPO="legandrop/LGA_MightyTools"
# La version va de a centesimos (D-02). `--check` sale con error si CMakeLists.txt, VERSION y el
# changelog no dicen lo mismo o si el bump no esta commiteado (D-59).
VERSION_REGEX='^[0-9]+\.[0-9]+$'
VERSION_CHECK_CMD="sh ./bump_version.sh --check"
# Para `--decide`: la version en desarrollo es la que encabeza el changelog, y el bump la sube a
# CMakeLists.txt y VERSION con commit + push, sin ofrecer publicar (de eso se encarga deploy.sh).
DEV_VERSION_FILE="Docs/Changelog.md"
BUMP_CMD="sh ./bump_version.sh --commit --no-publish"
# El release lleva un SHA256SUMS con las dos plataformas: Windows (instalador.bat) suma este.
SHA256SUMS=true
WIN_ASSET="LGA_MightyTools_Setup_v{v}.exe"
WHATS_NEW_FILE="Docs/WhatsNew.md"
# SHA-1 del certificado «LGA Code Signing». Esta FIJADO a proposito: el requisito designado de la app
# es `identifier + certificado`, y los permisos de macOS de los usuarios (Accesibilidad, acceso al
# disco) estan atados a el. Publicar con otro (o ad-hoc) se los hace perder a TODOS en la siguiente
# actualizacion. Cambiarlo es una decision de Lega. deploy.sh lo lee de aca para firmar y verificar.
PINNED_CERT_SHA1="9989B6EFE3798349A8747E15774439DB501F6AB2"
